[domains]
design-system = "inactive; reason: the repository ships the wgpu engine renderer, the windowed player, and the headless MCP editor host under editor/, while the person-facing graphical editor UI (scene view, inspector, hierarchy window) and any web/CSS design-system surface are not yet built, and sample/device rendering is verified deterministically against committed BMP baselines in make verify-samples and make verify-device, as recorded on 2026-11-27; review trigger: the person-facing graphical editor UI or a web/CSS component surface lands"
ux = "inactive; reason: the repository ships the engine runtime, the windowed player, and the headless MCP editor host under editor/, with no multi-screen application router or person-facing editor workflow UI yet, while sample game scenarios are verified in make verify-samples, as recorded on 2026-11-27; review trigger: the person-facing editor workflow UI or an application router surface lands"
performance = "inactive; reason: the seventeen engine and editor timing ceilings in tools/verify_perf.py (including IMPORT_REIMPORT_CEILING_MS = 8.4 and the scene-load, physics, 2D-physics, particle, animation, 100k frame-loop, 100k world-scale, scripting, player-startup, audio-callback, and editor MCP ceilings) are already owned and enforced by the make verify-perf named profile in verification-policy.md required_verification_profiles, and no separate criterion/k6/lighthouse benchmark suite exists outside that lane, as recorded on 2026-11-27; review trigger: a standalone benchmark suite or a performance surface outside make verify-perf lands"
memory-usage = "inactive; reason: the PlayerLoop per-frame managed allocation ceiling (value_bytes against ceiling_bytes in tools/verify_perf.py) is already owned and enforced by the make verify-perf named profile in verification-policy.md required_verification_profiles, and no standalone memory-budget manifest or long-running soak test exists outside that lane, as recorded on 2026-11-27; review trigger: a standalone memory budget or soak-test suite outside make verify-perf lands"
accessibility = "inactive; reason: the repository ships the wgpu engine renderer, the windowed player (with reduced_motion scenario coverage in make verify-samples), and the headless MCP editor host under editor/, while the person-facing graphical editor UI (scene view, inspector, hierarchy window) is not yet built, as recorded on 2026-11-27; review trigger: the person-facing graphical editor UI or a widget tree requiring accessibility conformance lands"
api-compatibility = "inactive; reason: the repository publishes no external API schema and no versioned public package release yet, while internal C ABI layout and MCP tool contracts are enforced in the default lane and make verify-benchmark, as recorded on 2026-11-27; review trigger: the first published API schema or versioned external package release lands"
data-storage = "inactive; reason: the repository owns no database and no schema migration, persisting only Unity tagged-YAML scenes/prefabs and sample PlayerPrefs files, as recorded on 2026-11-27; review trigger: a database or a persistent schema migration lands"
reliability-observability = "inactive; reason: the repository has no networked service deployment and no operations runbook, running locally as an engine library, local player, and local editor host, as recorded on 2026-11-27; review trigger: a deployed service or operations surface lands"
privacy = "inactive; reason: the repository holds no personal or regulated data and the data classification is still pending owner confirmation in security-policy.md, as recorded on 2026-11-27; review trigger: the project owner confirms personal or regulated data"
release-deployment = "inactive; reason: the repository publishes no release workflow and no distribution registry package yet (only local sample packaging in make verify-samples and CI verification in .github/workflows/verify.yml and .github/workflows/cla.yml), as recorded on 2026-11-27; review trigger: the first release workflow or distribution pipeline lands"
