schema_version = "v3"
default_budget_seconds = 60.0
kernel_controls = ["policy-structure", "public-behavior"]

[context]
impact = "low"
likelihood = "low"
uncertainty = "low"
recoverability = "high"
architectures = ["library"]
rate_of_change = "medium"
expected_lifetime = "long"
obligations = []

[[lanes]]
id = "default"
owner = "project maintainers"
trigger = "every change"

[[lanes]]
id = "triggered"
owner = "domain owner"
trigger = "declared risk or platform signal"

[[lanes]]
id = "human"
owner = "reviewer"
trigger = "judgment-dependent material change"

[[lanes]]
id = "operational"
owner = "project maintainers"
trigger = "a check that needs a long-running or scheduled environment"

[[lanes]]
id = "one-off"
owner = "reviewer"
trigger = "a single recorded evidence artifact that cannot be reproduced on demand"

[[controls]]
id = "policy-structure"
protected_outcome = "Project policy remains deterministic, bounded, and internally consistent"
fault_sensitivity = "Detects malformed or contradictory policy composition before agent work"
layer = "deterministic preflight"
owner = "project maintainers"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 0.23
cost_basis = "measured"
evidence = "the policy gate report naming every corpus finding it observed"
detects = "the corpus findings the policy gate reported: unresolved placeholders, duplicated facts, unapproved commands, unresolved enforcers, and cited paths that do not resolve"
retirement_trigger = "when the deterministic preflight is replaced by a published equivalent"
lifecycle = "review on every portfolio schema change; replace only with equivalent deterministic coverage"
disposition = "KEEP"
enforcement = "deterministic: make policy-validate"

[[controls]]
id = "public-behavior"
protected_outcome = "Material behavior claims are proven through public surfaces"
fault_sensitivity = "Detects claims supported only by narration or implementation-private observations"
layer = "black-box scenario"
owner = "project maintainers"
trigger = "material behavior change"
lane = "default"
marginal_cost_seconds = 4.3
cost_basis = "measured"
evidence = "the gate report naming the command that ran, the findings it printed, and the exit status"
detects = "the gate report that names the command that ran and the findings it printed"
retirement_trigger = "when every behavior claim is provable at a cheaper deterministic layer"
lifecycle = "review when the public contract or cheapest sufficient proof layer changes"
disposition = "KEEP"
enforcement = "deterministic: make verify"

[[controls]]
id = "type-system-escape-hatch-ban"
protected_outcome = "The per-language ban catalog has zero findings"
fault_sensitivity = "Detects constructs and suppression mechanisms that prevent complete type-checker or linter verification"
layer = "lint and typecheck gate"
owner = "clean-code owner"
trigger = "every maintained-language source change"
lane = "default"
marginal_cost_seconds = 0.24
cost_basis = "measured"
evidence = "the ban-catalog report naming every banned construct the gate found"
detects = "per-language ban catalog findings including rawtypes, unchecked, and BANNED-OBJECT-PARAMETER in C#, and widened SECRET_SCAN_EXCLUDES scope skipping checkpoint.json, bin, and obj"
retirement_trigger = "when every cataloged construct becomes structurally impossible"
lifecycle = "review when a maintained language, checker, linter, or ban catalog changes; merges C# rawtypes, unchecked, BANNED-OBJECT-PARAMETER ban detectors and widened SECRET_SCAN_EXCLUDES scope into this tooling control"
disposition = "MERGE"
enforcement = "deterministic: make banned-constructs"

[[controls]]
id = "dotnet-default-lane"
protected_outcome = "The C# UnityEngine bridge complies with build, format, and test contracts in the default lane"
fault_sensitivity = "Detects C# compilation errors, formatting divergences, analyzer warnings, and UnityEngine lifecycle deviations"
layer = "default gate"
owner = "bridge owner"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 3.8
cost_basis = "measured"
evidence = "the verify report recording clean dotnet-build, dotnet-format, and dotnet-test gate results within budget"
detects = "C# compilation errors, analyzer diagnostics, unformatted C# source files, and UnityEngine lifecycle test failures"
retirement_trigger = "when the C# bridge is replaced by an alternate language implementation"
lifecycle = "review on every .NET SDK bump or bridge architecture change; disposition: KEEP as a parallel lane"
disposition = "KEEP"
enforcement = "deterministic: make verify"

[[controls]]
id = "strictest-lint-configuration"
protected_outcome = "The lint configuration enables every rule and carries no banned-rule bypass"
fault_sensitivity = "Detects a disabled rule that does not fire on common safe use, a banned per-file ignore, a banned extend-ignore, or an inline suppression marker"
layer = "lint configuration audit"
owner = "lint owner"
trigger = "every lint configuration or maintained-language source change"
lane = "default"
marginal_cost_seconds = 0.22
cost_basis = "measured"
evidence = "the bypass audit report naming the configuration bypasses it found"
detects = "disabled-rule and banned-rule bypass findings"
retirement_trigger = "when lint configuration bypasses become structurally impossible"
lifecycle = "review when the linter, rule set, configuration, or suppression syntax changes"
disposition = "KEEP"
enforcement = "deterministic: make bypass-audit"

[local_tightening]
controls = []
