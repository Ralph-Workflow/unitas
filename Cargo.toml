# Governed by docs/ralph-workflow-policy/linting-policy.md and docs/ralph-workflow-policy/typechecking-policy.md
[workspace]
resolver = "2"
members = [
    "crates/unitas-animation",
    "crates/unitas-asset",
    "crates/unitas-audio",
    "crates/unitas-build",
    "crates/unitas-core",
    "crates/unitas-dotnet",
    "crates/unitas-editor-abi",
    "crates/unitas-jobs",
    "crates/unitas-physics",
    "crates/unitas-render",
    "crates/unitas-runtime",
]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unnecessary_transmutes = "deny"
static_mut_refs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# clean-code-policy.md bans all comments and doc comments in Rust source files
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
doc_markdown = "allow"
# Fires across 834 accessor, constructor, and builder methods on common safe use
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Fires on common safe numeric conversions (f64/f32/usize/u32/i32) in 3D math, physics, audio, and rendering
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Fires on domain coordinate/math names, state flags, numeric literals, and float comparisons on common safe use
similar_names = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
# Fires on common safe control-flow, signature, and string-formatting idioms across the workspace
manual_let_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
unnecessary_wraps = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
map_unwrap_or = "allow"
case_sensitive_file_extension_comparisons = "allow"
assigning_clones = "allow"
needless_pass_by_value = "allow"
manual_midpoint = "allow"
if_not_else = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"
ref_option = "allow"

[profile.dev.package.rapier2d]
debug-assertions = false

[profile.dev.package.rapier3d]
debug-assertions = false

[profile.dev.package.unitas-build]
opt-level = 2
