# Governed by docs/ralph-workflow-policy/linting-policy.md and docs/ralph-workflow-policy/typechecking-policy.md
[package]
name = "unitas-build"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
default = []
device = ["unitas-runtime/device", "unitas-render/device", "unitas-audio/device"]

[dependencies]
serde_json = "1"
unitas-asset = { path = "../unitas-asset" }
unitas-audio = { path = "../unitas-audio" }
unitas-core = { path = "../unitas-core" }
unitas-dotnet = { path = "../unitas-dotnet" }
unitas-render = { path = "../unitas-render" }
unitas-runtime = { path = "../unitas-runtime" }

[[bin]]
name = "unitas-player"
path = "src/bin/unitas-player.rs"
