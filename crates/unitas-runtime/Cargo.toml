[package]
name = "unitas-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
device = ["dep:winit", "unitas-render/device", "unitas-audio/device"]

[dependencies]
unitas-animation = { path = "../unitas-animation" }
unitas-asset = { path = "../unitas-asset" }
unitas-audio = { path = "../unitas-audio" }
unitas-core = { path = "../unitas-core" }
unitas-physics = { path = "../unitas-physics" }
unitas-render = { path = "../unitas-render" }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
unitas-render = { path = "../unitas-render" }
