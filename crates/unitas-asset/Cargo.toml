# Governed by docs/ralph-workflow-policy/linting-policy.md and docs/ralph-workflow-policy/typechecking-policy.md
[package]
name = "unitas-asset"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
swash = "0.1.19"
unitas-animation = { path = "../unitas-animation" }
unitas-core = { path = "../unitas-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lewton = "0.10.2"
minimp3 = "0.6.1"
